<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify OTP | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="verify">
<div class="auth-wrap"><div class="glass auth-card"><div id="alert"></div><div class="text-center mb-3"><div class="rocket">🚀</div><h1 class="h3 fw-bold mt-2">Verify OTP</h1><p class="text-secondary mb-0">Enter the 6-digit code</p></div>
<div id="devBox" class="alert alert-warning small d-none"></div>
<form id="verifyForm" novalidate>
<label class="form-label" for="email">Email</label><input type="email" id="email" class="form-control" autocomplete="email">
<label class="form-label mt-3" for="otp">OTP</label><input id="otp" class="form-control text-center fs-4" maxlength="6" inputmode="numeric" placeholder="______" autocomplete="one-time-code">
<button class="btn btn-launch w-100 mt-4" id="btn" type="submit">Verify OTP</button>
</form>
<div class="d-grid mt-3"><button class="btn btn-outline-info" id="resendBtn" type="button">Resend OTP</button></div>
<div class="text-center mt-3 small"><a href="/login.html">Back to Login</a></div>
<p class="small text-secondary mt-2 mb-0">Tip: in development mode the OTP is printed in the server terminal.</p><div class="stem-icons mt-4">⚛️ 🔬 💻 🧩 🧪 🤖</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
