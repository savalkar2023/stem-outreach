<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="reset">
<div class="auth-wrap"><div class="glass auth-card"><div id="alert"></div><div class="text-center mb-3"><div class="rocket">🚀</div><h1 class="h3 fw-bold mt-2">New Password</h1><p class="text-secondary mb-0">Choose a new password</p></div>
<form id="resetForm" novalidate>
<label class="form-label" for="password">New Password</label><input type="password" id="password" class="form-control" autocomplete="new-password">
<label class="form-label mt-3" for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" class="form-control" autocomplete="new-password">
<button class="btn btn-launch w-100 mt-4" id="btn" type="submit">Update Password</button>
</form><div class="stem-icons mt-4">⚛️ 🔬 💻 🧩 🧪 🤖</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
