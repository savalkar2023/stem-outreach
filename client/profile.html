<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
<div id="nav"></div>
<main class="container py-4"><div id="alert"></div>

<div class="row g-3"><div class="col-lg-4"><div class="glass text-center" id="pView">Loading...</div></div>
<div class="col-lg-8">
<div class="glass mb-3"><h2 class="h5">Edit Profile</h2>
<form id="editForm" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="pName">Full Name</label><input id="pName" class="form-control"></div>
<div class="col-md-6"><label class="form-label" for="pMobile">Mobile</label><input id="pMobile" class="form-control" inputmode="numeric"></div>
<div class="col-md-6"><label class="form-label" for="pSchool">School</label><input id="pSchool" class="form-control"></div>
<div class="col-md-3"><label class="form-label" for="pClass">Class</label><select id="pClass" class="form-select"></select></div>
<div class="col-md-3"><label class="form-label" for="pCity">City</label><input id="pCity" class="form-control"></div></div>
<div class="d-flex flex-wrap gap-2 mt-3"><button class="btn btn-launch" id="saveBtn" type="submit">Save Changes</button>
<label class="btn btn-outline-info mb-0">Change Photo<input type="file" id="photoInput" accept="image/*" hidden></label></div></form></div>
<div class="glass"><h2 class="h5">Change Password</h2>
<form id="pwForm" novalidate><div class="row g-3">
<div class="col-md-4"><label class="form-label" for="curPw">Current Password</label><input type="password" id="curPw" class="form-control" autocomplete="current-password"></div>
<div class="col-md-4"><label class="form-label" for="newPw">New Password</label><input type="password" id="newPw" class="form-control" autocomplete="new-password"></div>
<div class="col-md-4"><label class="form-label" for="confPw">Confirm New</label><input type="password" id="confPw" class="form-control" autocomplete="new-password"></div></div>
<button class="btn btn-launch mt-3" id="pwBtn" type="submit">Change Password</button></form></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
