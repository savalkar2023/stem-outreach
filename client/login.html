<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<div class="auth-wrap"><div class="glass auth-card"><div id="alert"></div><div class="text-center mb-3"><div class="rocket">🚀</div><h1 class="h3 fw-bold mt-2">STEM Outreach Lab</h1><p class="text-secondary mb-0">Login to start your learning mission</p></div>
<form id="loginForm" novalidate>
<label class="form-label" for="email">Email</label>
<input type="email" id="email" class="form-control" autocomplete="username" placeholder="you@example.com">
<label class="form-label mt-3" for="password">Password</label>
<input type="password" id="password" class="form-control" autocomplete="current-password" placeholder="Your password">
<button class="btn btn-launch w-100 mt-4" id="btn" type="submit">Login</button>
</form>
<div class="d-grid mt-3"><a class="btn btn-outline-info" href="/register.html">Create New Account</a></div>
<div class="d-flex justify-content-between mt-3 small"><a href="/forgot-password.html">Forgot Password?</a><a href="/verify-otp.html">Verify OTP</a></div><div class="stem-icons mt-4">⚛️ 🔬 💻 🧩 🧪 🤖</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
