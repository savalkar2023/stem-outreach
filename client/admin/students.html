<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="adminStudents">
<div id="nav"></div>
<main class="container py-4"><div id="alert"></div>

<h1 class="h3 fw-bold mb-3">Student Management</h1>
<div class="glass mb-3"><div class="row g-2">
<div class="col-md-5"><input id="search" class="form-control" placeholder="Search name, email or school"></div>
<div class="col-md-3"><select id="fClass" class="form-select"><option value="">All classes</option></select></div>
<div class="col-md-4"><select id="fStatus" class="form-select"><option value="">All status</option><option>Not started</option><option>In progress</option><option>Completed</option></select></div></div></div>
<div class="glass table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>School</th><th>Class</th><th>Activities</th><th>Score</th><th>Status</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="8">Loading...</td></tr></tbody></table></div>
<div class="modal fade" id="sModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title h5">Student Details</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body" id="sBody"></div></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
