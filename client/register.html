<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="register">
<div class="auth-wrap"><div class="glass auth-card wide"><div id="alert"></div><div class="text-center mb-3"><div class="rocket">🚀</div><h1 class="h3 fw-bold mt-2">Create your account</h1><p class="text-secondary mb-0">Join the STEM mission</p></div>
<form id="regForm" novalidate>
<div class="text-center my-3"><img id="preview" class="avatar d-none" alt="Photo preview">
<div><label class="btn btn-sm btn-outline-info mt-2">Choose Profile Photo<input type="file" id="photo" accept="image/*" hidden></label></div></div>
<div class="row g-3">
<div class="col-md-6"><label class="form-label" for="name">Full Name</label><input id="name" class="form-control" autocomplete="name"></div>
<div class="col-md-6"><label class="form-label" for="email">Email</label><input type="email" id="email" class="form-control" autocomplete="email"></div>
<div class="col-md-6"><label class="form-label" for="mobile">Mobile Number</label><input id="mobile" class="form-control" inputmode="numeric" autocomplete="tel" placeholder="10 digits"></div>
<div class="col-md-6"><label class="form-label" for="school">School Name</label><input id="school" class="form-control"></div>
<div class="col-md-6"><label class="form-label" for="grade">Class / Grade</label><select id="grade" class="form-select"></select></div>
<div class="col-md-6"><label class="form-label" for="city">City</label><input id="city" class="form-control"></div>
<div class="col-md-6"><label class="form-label" for="password">Password</label><input type="password" id="password" class="form-control" autocomplete="new-password" placeholder="Letters + numbers, 6+"></div>
<div class="col-md-6"><label class="form-label" for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" class="form-control" autocomplete="new-password"></div>
</div>
<button class="btn btn-launch w-100 mt-4" id="btn" type="submit">Send OTP</button>
</form>
<div class="text-center mt-3 small">Already have an account? <a href="/login.html">Login</a></div><div class="stem-icons mt-4">⚛️ 🔬 💻 🧩 🧪 🤖</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
