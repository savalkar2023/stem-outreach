<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress | STEM Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="progress">
<div id="nav"></div>
<main class="container py-4"><div id="alert"></div>

<h1 class="h3 fw-bold mb-3">My Progress</h1><div class="row g-3 mb-3" id="cards"></div><div id="impBox"></div>
<div class="row g-3 mt-1">
<div class="col-lg-6"><div class="glass"><h2 class="h6">Pre vs Post Assessment</h2><div class="chart-box"><canvas id="cPrePost"></canvas></div></div></div>
<div class="col-lg-6"><div class="glass"><h2 class="h6">Category Performance</h2><div class="chart-box"><canvas id="cCat"></canvas></div></div></div>
<div class="col-lg-6"><div class="glass"><h2 class="h6">Activity Scores</h2><div class="chart-box"><canvas id="cAct"></canvas></div></div></div>
<div class="col-lg-6"><div class="glass"><h2 class="h6">Overall Progress</h2><div class="chart-box"><canvas id="cAll"></canvas></div></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
